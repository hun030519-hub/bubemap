<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부비맵 - 무료 지도 버전</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; background-color: #fafafa; }
        header { background: white; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .brand { display: flex; align-items: center; justify-content: space-between; }
        .brand h1 { margin: 0; font-size: 20px; color: #1e3a8a; }
        .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #e0f2fe; color: #0369a1; }
        
        #map { width: 100%; height: calc(100vh - 65px); z-index: 1; }
        
        .info-window { font-size: 13px; line-height: 1.5; min-width: 180px; }
        .info-window h3 { margin: 0 0 5px 0; font-size: 15px; color: #111827; }
        .info-window .facility { color: #6b7280; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>🌊 부비맵 (무료 지도 버전)</h1>
            <div id="gpsStatus" class="status-badge">데이터 불러오는 중...</div>
        </div>
    </header>

    <div id="map"></div>

    <script src="config.local.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. 지도 기본 설정 (부산시청 중심)
        let map = L.map('map').setView([35.1795543, 129.0756416], 13);
        let markersGroup = L.layerGroup().addTo(map);

        // OpenStreetMap 타일 불러오기 (무료, 키 필요 없음)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 2. 실행 시 바로 Supabase에서 데이터 가져오기
        window.onload = function() {
            if (!window.BUBIMAP_SUPABASE_CONFIG || !window.BUBIMAP_SUPABASE_CONFIG.supabaseUrl) {
                document.getElementById('gpsStatus').innerText = "⚠️ config.local.js 설정을 확인해주세요.";
                return;
            }
            fetchCoursesFromSupabase();
        };

        // 3. Supabase 연결 및 데이터 로드 함수
        function fetchCoursesFromSupabase() {
            const CONFIG = window.BUBIMAP_SUPABASE_CONFIG;
            
            // 데이터베이스의 busan_courses 테이블에서 모든 데이터 가져오기
            const url = `${CONFIG.supabaseUrl}/rest/v1/busan_courses?select=*`;

            fetch(url, {
                method: 'GET',
                headers: {
                    'apikey': CONFIG.supabaseAnonKey,
                    'Authorization': `Bearer ${CONFIG.supabaseAnonKey}`
                }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('gpsStatus').innerText = `✅ 데이터 ${data.length}개 연결됨`;
                renderMarkers(data);
            })
            .catch(err => {
                console.error("오류 발생:", err);
                document.getElementById('gpsStatus').innerText = "⚠️ 데이터베이스 연결 실패";
            });
        }

        // 4. 지도에 마커 찍기
        function renderMarkers(courses) {
            markersGroup.clearLayers();

            courses.forEach(course => {
                if(!course.latitude || !course.longitude) return; // 좌표 없는 데이터 패스

                const marker = L.marker([course.latitude, course.longitude]);
                
                // 마커 클릭 시 나오는 말풍선(팝업)
                const popupContent = `
                    <div class="info-window">
                        <h3>${course.title}</h3>
                        <div class="facility">🏢 ${course.facility_name || '공공시설'}</div>
                        <div>💰 수강료: <span style="color:#10b981; font-weight:bold;">${course.fee}</span></div>
                        <div>🚦 상태: ${course.status || '확인필요'}</div>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);
            });
        }
    </script>
</body>
</html>
